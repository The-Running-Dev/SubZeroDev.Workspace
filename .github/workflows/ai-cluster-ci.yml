name: AI Cluster CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ai-cluster-ci.yml'
      - 'setup-llm/ai-cluster/**'
      - 'setup-llm/scripts/**'
      - 'setup-llm/package*.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ai-cluster-ci.yml'
      - 'setup-llm/ai-cluster/**'
      - 'setup-llm/scripts/**'
      - 'setup-llm/package*.json'
  workflow_dispatch:

concurrency:
  group: ai-cluster-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Validate AI cluster contracts
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/pwsh-ci.yml@v1
    permissions:
      contents: read
    with:
      paths: setup-llm/ai-cluster
      tests: setup-llm/ai-cluster/tests
      # Static and config checks.
      pre-build: |
        setup-llm/scripts/Install-AISettingsDependencies.ps1
        setup-llm/ai-cluster/scripts/Test-AiCluster.ps1
        setup-llm/ai-cluster/scripts/Test-OperationalControls.ps1
      # Gateway contract checks against deterministic backends, then the hardware smoke suite,
      # which skips in standard CI.
      post-build: |
        setup-llm/ai-cluster/scripts/Test-GatewayContract.ps1
        setup-llm/ai-cluster/scripts/Test-EmbeddingsContract.ps1
        setup-llm/ai-cluster/scripts/Test-ProviderReplacementAndFailure.ps1
        setup-llm/ai-cluster/scripts/Test-HardwareSmoke.ps1
