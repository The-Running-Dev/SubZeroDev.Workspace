name: SubZeroDev Automator GitHub Plugin

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/subzerodev-automator-github.yml'
      - 'plugins/SubZeroDev.Automator.Plugins.GitHub/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/subzerodev-automator-github.yml'
      - 'plugins/SubZeroDev.Automator.Plugins.GitHub/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subzerodev-automator-github-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows is where line endings and the entry-point symlink actually
      # differ, so a Windows failure must be visible rather than cancelling the
      # Linux run that would have explained it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # bash on the Windows runner too, so the smoke tests below are one
        # script rather than one per platform.
        shell: bash
        working-directory: plugins/SubZeroDev.Automator.Plugins.GitHub
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/SubZeroDev.Automator.Plugins.GitHub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate and build
        run: npm run check

      - name: Smoke-test CLI
        run: node dist/cli.js --help | grep -q 'subzerodev-github <command>'

      - name: Smoke-test installed binary
        run: |
          npm link
          subzerodev-github --help | grep -q 'subzerodev-github <command>'

      - name: Test PowerShell runner
        shell: pwsh
        run: ./run.ps1 -Mode Local -SkipInstall -CliArgument '--help'

  container:
    name: Build container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: plugins/SubZeroDev.Automator.Plugins.GitHub
          push: false
          tags: subzerodev-automator-plugins-github:test
