name: SubZeroDev Automator GitHub Plugin

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/subzerodev-automator-github.yml'
      - 'plugins/SubZeroDev.Automator.Plugins.GitHub/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/subzerodev-automator-github.yml'
      - 'plugins/SubZeroDev.Automator.Plugins.GitHub/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subzerodev-automator-github-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/SubZeroDev.Automator.Plugins.GitHub
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/SubZeroDev.Automator.Plugins.GitHub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Validate and build
        run: npm run check

      - name: Smoke-test CLI
        run: node dist/cli.js --help

      - name: Test PowerShell runner
        shell: pwsh
        run: ./run.ps1 -Mode Local -SkipInstall -CliArgument '--help'

  container:
    name: Build container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: plugins/SubZeroDev.Automator.Plugins.GitHub
          push: false
          tags: subzerodev-automator-plugins-github:test
