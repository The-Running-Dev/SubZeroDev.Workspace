name: Documentation Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/docs-pages.yml'
      - '.dockerignore'
      - 'setup-llm/Dockerfile'
      - 'setup-llm/entrypoint.ps1'
      - 'docs-template'
      - 'README.md'
      - 'setup-llm/README.md'
      - 'setup-llm/docs/**'
      - 'setup-llm/scripts/docs-workflow-local.ps1'
      - 'setup-llm/scripts/expand-docs-artifact.ps1'
      - 'setup-llm/scripts/setup-docs.ps1'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/docs-pages.yml'
      - '.dockerignore'
      - 'setup-llm/Dockerfile'
      - 'setup-llm/entrypoint.ps1'
      - 'docs-template'
      - 'README.md'
      - 'setup-llm/README.md'
      - 'setup-llm/docs/**'
      - 'setup-llm/scripts/docs-workflow-local.ps1'
      - 'setup-llm/scripts/expand-docs-artifact.ps1'
      - 'setup-llm/scripts/setup-docs.ps1'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Synchronizes setup-llm/docs into docs-template, builds the Docusaurus site and
  # deploys it to GitHub Pages from main. Pull requests only build.
  build:
    name: Documentation
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/docs.yml@v0
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      source: docs-template
      builder: node
      build-command: build:prod
      output: docs-template/artifacts
      pre-build: setup-llm/scripts/setup-docs.ps1

  # Builds the runtime-prebuilt image around that site, serves it on 8080 as a smoke
  # test and publishes ghcr.io/the-running-dev/subzerodev-workspace from main.
  # GitHub checks the publish job's permissions before the run starts, so pull
  # requests grant them too.
  container:
    name: Container
    needs: build
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/container.yml@v0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      dockerfile: setup-llm/Dockerfile
      target: runtime-prebuilt
      image-name: subzerodev-workspace
      artifact: github-pages
      artifact-path: docs-template/pages-artifact
      pre-build: setup-llm/scripts/expand-docs-artifact.ps1
      smoke-port: '8080'
