# Setup Configuration Example
# Conforms to setup-schema.json
# Customize these values for your workstation

setup:
  version: "1.0"
  script_name: "setup.ps1"
  
  prerequisites:
    powershell: "7.0"
    git: "2.30"
    docker: "20.10"
    nodejs: "18"
    python: "3.8"
  
  parameters:
    Client: "Both"
    IncludeFilesystem: true
    FilesystemPath: "/path/to/projects"
    SkipGraphify: false
    SkipClaudeMem: true
    SkipGitHub: false
    SkipPlaywright: false
  
  components:
    - name: "Command-line Prerequisites"
      purpose: "Git, Node.js, Python validation"
      enabled: true
      required: true
      docker: false
    
    - name: "Graphify"
      purpose: "Repository knowledge graph indexing"
      enabled: true
      required: false
      docker: false
    
    - name: "Claude Memory"
      purpose: "Persistent memory system (claude-mem)"
      enabled: true
      required: false
      docker: false
    
    - name: "GitHub MCP"
      purpose: "GitHub API access"
      enabled: true
      required: true
      docker: true
      environment_variables:
        GITHUB_PERSONAL_ACCESS_TOKEN: "${env:GITHUB_PERSONAL_ACCESS_TOKEN}"
    
    - name: "Playwright MCP"
      purpose: "Browser automation"
      enabled: true
      required: false
      docker: false
    
    - name: "Filesystem MCP"
      purpose: "Local file system access"
      enabled: true
      required: false
      docker: false
      environment_variables:
        FILESYSTEM_ALLOWED_ROOT: "${FilesystemPath}"
  
  clients:
    - name: "Claude Code"
      enabled: true
      mcp_servers:
        - "github"
        - "playwright"
        - "filesystem"
        - "graphify"
      config_path: "~/.anthropic/claude-code-config.json"
    
    - name: "Codex"
      enabled: true
      mcp_servers:
        - "github"
        - "playwright"
        - "filesystem"
      config_path: "${env:CODEX_CONFIG_DIR}"
    
    - name: "Claude Desktop"
      enabled: false
      mcp_servers:
        - "github"
      config_path: "~/.claude/claude.json"

validation:
  phase1_checks:
    - name: "Verify Git"
      command: "git --version"
      expected_output: "git version"
    
    - name: "Verify Docker"
      command: "docker --version"
      expected_output: "Docker version"
    
    - name: "Verify Node.js"
      command: "node --version"
      expected_output: "v"
    
    - name: "Verify MCP tools"
      command: "/mcp"
      expected_output: "github"
  
  phase3_checks:
    - name: "Claude Code context loads"
      client: "Claude Code"
      command: "/context"
    
    - name: "Codex MCP available"
      client: "Codex"
      command: "/mcp"

troubleshooting:
  setup_script_fails:
    cause: "Prerequisites missing"
    resolution: "Run the matching platform setup script and verify Docker Desktop or Docker Engine is running"
    phase: "1"
  
  mcp_tools_not_visible:
    cause: "Client not restarted after setup"
    resolution: "Restart Claude Code or Codex; start a new Codex session"
    phase: "1"
  
  github_mcp_fails:
    cause: "Docker not running or token invalid"
    resolution: "Ensure Docker Desktop or Docker Engine is running; verify GITHUB_PERSONAL_ACCESS_TOKEN in .env"
    phase: "1"
  
  filesystem_mcp_cannot_access:
    cause: "Project not under allowed root"
    resolution: "Move project under FilesystemPath or re-run setup with correct path"
    phase: "2"
  
  instructions_not_loading:
    cause: "Wrong filename or wrong directory"
    resolution: "Verify exact filenames (AGENTS.md, CLAUDE.md) and client opened at repository root"
    phase: "3"
  
  graph_information_stale:
    cause: "Graphify cache outdated"
    resolution: "Re-run /graphify . after moving files or major refactoring"
    phase: "3"
  
  secrets_leaked_to_git:
    cause: ".gitignore not set before commit"
    resolution: "Remove from tracked files and history; rotate secrets; verify .gitignore"
    phase: "2"
